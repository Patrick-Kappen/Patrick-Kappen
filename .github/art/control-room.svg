<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Patrick's control room</title>
  <desc id="desc">A homelab rack, a terminal and a cheerful AI robot reaching for a locked production button. The robot has no production keys.</desc>
  <defs>
    <linearGradient id="accent">
      <stop stop-color="#f58220" data-stop-color="accent"/>
      <stop offset="1" stop-color="#ffa45b" data-stop-color="label"/>
    </linearGradient>
  </defs>
  <!-- Regions retain the original drawing coordinates; desktop lays them out independently. -->
  <g data-region="copy">
  <!-- The nameplate. Essential profile text also lives outside the image. -->
  <g font-family="Verdana, Arial, sans-serif">
    <rect x="48" y="42" width="192" height="30" rx="15" fill="none"/>
    <circle cx="66" cy="57" r="5" fill="#f58220" data-fill="accent"/>
    <text x="80" y="63" font-size="15" font-weight="700" letter-spacing="2" fill="#ffa45b" data-fill="label">HOMELAB ONLINE</text>
    <text x="48" y="132" font-size="44" font-weight="700" letter-spacing="1" fill="#f2f0ed" data-fill="text">PATRICK'S</text>
    <text x="48" y="185" font-size="44" font-weight="700" letter-spacing="1" fill="url(#accent)">CONTROL ROOM</text>
    <text x="50" y="222" font-size="19" fill="#b9b7b4" data-fill="muted">Infrastructure. Experiments. A suspicious electricity bill.</text>
  </g>

  <!-- A small terminal: boring production is a feature. -->
  <g font-family="monospace" font-size="18">
    <rect x="48" y="254" width="520" height="141" rx="12" fill="none" stroke="#45413d" data-stroke="muted" stroke-width="2"/>
    <path d="M49 285H567" stroke="#393735" data-stroke="line"/>
    <circle cx="68" cy="270" r="4" fill="#6b625b" data-fill="muted"/>
    <circle cx="84" cy="270" r="4" fill="#ffa45b" data-fill="label"/>
    <circle cx="100" cy="270" r="4" fill="#f58220" data-fill="accent"/>
    <text x="124" y="276" font-size="14" fill="#b9b7b4" data-fill="muted">patrick@homelab ~</text>
    <text x="68" y="315" fill="#f2f0ed" data-fill="text"><tspan fill="#f58220" data-fill="accent">$ </tspan>nix run .#another-side-project</text>
    <text x="68" y="346" fill="#b9b7b4" data-fill="muted">building…</text>
    <text x="68" y="377" fill="#ffa45b" data-fill="label">production excitement: 0 (as intended)</text>
  </g>

  </g>
  <g data-region="rack">
  <g fill="none" stroke-width="2" opacity=".7">
    <path d="M601 44v14m-7-7h14" stroke="#f58220" data-stroke="accent"/>
    <path d="M600 210l5-5 5 5-5 5z" stroke="#ffa45b" data-stroke="label"/>
    <circle cx="837" cy="39" r="4" stroke="#ffa45b" data-stroke="label"/>
  </g>
  <!-- The rack, with unnecessarily tidy patch cables. -->
  <g stroke="#68615b" data-stroke="muted" stroke-width="2" stroke-linejoin="round">
    <rect x="648" y="128" width="176" height="257" rx="12" fill="none"/>
    <rect x="660" y="143" width="152" height="47" rx="5" fill="none"/>
    <rect x="660" y="200" width="152" height="47" rx="5" fill="none"/>
    <rect x="660" y="257" width="152" height="47" rx="5" fill="none"/>
    <rect x="660" y="314" width="152" height="47" rx="5" fill="none"/>
    <path d="M680 160h48m-48 12h48m-48 45h48m-48 12h48m-48 45h48m-48 12h48m-48 45h48m-48 12h48" stroke="#a39d97" data-stroke="muted" stroke-width="3"/>
    <path d="M794 176v36m-10 21v36m10 21v36" fill="none" stroke="#f58220" data-stroke="accent" stroke-width="4"/>
    <path d="M674 385v12m124-12v12" stroke-width="7"/>
  </g>
  <g fill="#f58220" data-fill="accent">
    <circle cx="772" cy="166" r="4"/>
    <circle cx="772" cy="223" r="4"/>
    <circle cx="772" cy="280" r="4"/>
    <circle cx="772" cy="337" r="4"/>
  </g>
  <text x="736" y="111" text-anchor="middle" font-family="monospace" font-size="17" fill="#b9b7b4" data-fill="muted">definitely needed.</text>

  </g>
  <g data-region="intern">
  <g fill="none" stroke-width="2" opacity=".7">
    <path d="M847 359v14m-7-7h14" stroke="#f58220" data-stroke="accent"/>
    <path d="M1131 334l5-5 5 5-5 5z" stroke="#ffa45b" data-stroke="label"/>
  </g>
  <!-- An enthusiastic intern. Access denied, affectionately. -->
  <g stroke="#f58220" data-stroke="accent" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M920 258l-34 25-32-15m120-10 31-37 25 8" fill="none"/>
    <path d="M928 326l-9 40h-22m61-40 10 40h21" fill="none" stroke-width="8"/>
    <rect x="910" y="248" width="70" height="83" rx="17" fill="none"/>
    <rect x="896" y="170" width="99" height="78" rx="21" fill="none"/>
    <path d="M945 170v-20"/>
    <circle cx="945" cy="144" r="6" fill="#ffa45b" data-fill="label" stroke="#ffa45b" data-stroke="label"/>
    <path d="M921 200v8m48-8v8" stroke="#f2f0ed" data-stroke="text" stroke-width="7"/>
    <path d="M933 223q12 10 24 0" fill="none"/>
  </g>
  <rect x="918" y="269" width="54" height="29" rx="5" fill="#ffa45b" data-fill="label"/>
  <text x="945" y="289" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#111111" data-fill="on_accent">AI</text>
  <text x="945" y="397" text-anchor="middle" font-family="monospace" font-size="17" fill="#b9b7b4" data-fill="muted">intern permissions</text>

  <!-- Production is behind a lock, not a pinky promise. -->
  <g stroke="#ffa45b" data-stroke="label" stroke-width="2.5" stroke-linejoin="round">
    <rect x="1041" y="174" width="112" height="91" rx="12" fill="none"/>
    <circle cx="1097" cy="216" r="23" fill="none" stroke="#ffa45b" data-stroke="label"/>
    <rect x="1085" y="208" width="24" height="20" rx="3" fill="none" stroke="#f2f0ed" data-stroke="text"/>
    <path d="M1090 208v-7a7 7 0 0 1 14 0v7" fill="none" stroke="#f2f0ed" data-stroke="text"/>
  </g>
  <text x="1097" y="253" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffa45b" data-fill="label">PRODUCTION</text>
  <g font-family="Verdana, Arial, sans-serif" font-size="17" fill="#f2f0ed" data-fill="text">
    <rect x="865" y="47" width="288" height="58" rx="14" fill="none" stroke="#68615b" data-stroke="muted" stroke-width="2"/>
    <path d="M940 105l10 15 10-15" fill="none" stroke="#68615b" data-stroke="muted" stroke-width="2"/>
    <path d="M941 104h18" stroke="none" stroke-width="3"/>
    <text x="1009" y="82" text-anchor="middle">“Can I deploy this?”</text>
  </g>
  <text x="1097" y="293" text-anchor="middle" font-family="monospace" font-size="17" fill="#ffa45b" data-fill="label">nice try.</text>
  </g>
</svg>
