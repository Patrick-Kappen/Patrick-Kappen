<svg xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img" aria-labelledby="title desc">
<title id="title">Patrick-Kappen/PiG</title>
<desc id="desc">PiG (Pi in Go) is a faithful Go port of upstream Pi, the TypeScript codebase behind the Pi coding agent. It is a parity-bound translation, not a rewrite: upstream behavior is the contract, and Go is the implementation language. Latest activity: Refuse tool arguments that are no JSON object, as Pi does. MERGED PR on 2026-11-13.</desc>
