<title id="title">Patrick-Kappen/PiG</title>
<desc id="desc">PiG (Pi in Go) is a faithful Go port of upstream Pi, the TypeScript codebase behind the Pi coding agent. It is a parity-bound translation, not a rewrite: upstream behavior is the contract, and Go is the implementation language. Latest activity: Expose ordered input in tool_result handlers. OPEN PR on 2026-11-13.</desc>
