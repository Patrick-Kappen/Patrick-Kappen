<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Patrick's control room</title>
  <desc id="desc">A homelab rack, a terminal and a cheerful AI robot reaching for a locked production button. The robot has no production keys.</desc>
  <defs>
    <clipPath id="frame"><rect x="2" y="2" width="1196" height="436" rx="23"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#303030" stroke-width="1" opacity=".45"/>
    </pattern>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111111"/>
      <stop offset=".52" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#f58220"/>
      <stop offset=".35" stop-color="#d96b22"/>
      <stop offset=".68" stop-color="#f58220"/>
      <stop offset="1" stop-color="#ffa45b"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#background)" stroke="#45413d" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <circle cx="175" cy="50" r="220" fill="#f58220" opacity=".12"/>
    <circle cx="1050" cy="340" r="170" fill="#f58220" opacity=".08"/>
  </g>
  <rect x="2" y="2" width="1196" height="436" rx="23" fill="url(#grid)"/>
  <rect x="32" y="1" width="1136" height="5" rx="2" fill="url(#accent)"/>
  <g fill="none" stroke-width="2" opacity=".7">
    <path d="M601 44v14m-7-7h14M847 359v14m-7-7h14" stroke="#f58220"/>
    <path d="M600 210l5-5 5 5-5 5zM1131 334l5-5 5 5-5 5z" stroke="#ffa45b"/>
    <circle cx="837" cy="39" r="4" stroke="#ffa45b"/>
  </g>

  <!-- The nameplate. Essential profile text also lives outside the image. -->
  <g font-family="Verdana, Arial, sans-serif">
    <rect x="48" y="42" width="192" height="30" rx="15" fill="#2c2824"/>
    <circle cx="66" cy="57" r="5" fill="#f58220"/>
    <text x="80" y="63" font-size="15" font-weight="700" letter-spacing="2" fill="#ffa45b">HOMELAB ONLINE</text>
    <text x="48" y="132" font-size="44" font-weight="700" letter-spacing="1" fill="#f2f0ed">PATRICK'S</text>
    <text x="48" y="185" font-size="44" font-weight="700" letter-spacing="1" fill="url(#accent)">CONTROL ROOM</text>
    <text x="50" y="222" font-size="19" fill="#b9b7b4">Infrastructure. Experiments. A suspicious electricity bill.</text>
  </g>

  <!-- A small terminal: boring production is a feature. -->
  <g font-family="monospace" font-size="18">
    <rect x="48" y="254" width="520" height="141" rx="12" fill="#111111" stroke="#45413d" stroke-width="2"/>
    <path d="M49 285H567" stroke="#393735"/>
    <circle cx="68" cy="270" r="4" fill="#6b625b"/>
    <circle cx="84" cy="270" r="4" fill="#ffa45b"/>
    <circle cx="100" cy="270" r="4" fill="#f58220"/>
    <text x="124" y="276" font-size="14" fill="#b9b7b4">patrick@homelab ~</text>
    <text x="68" y="315" fill="#f2f0ed"><tspan fill="#f58220">$ </tspan>nix run .#another-side-project</text>
    <text x="68" y="346" fill="#b9b7b4">building…</text>
    <text x="68" y="377" fill="#ffa45b">production excitement: 0 (as intended)</text>
  </g>

  <!-- The rack, with unnecessarily tidy patch cables. -->
  <g stroke="#68615b" stroke-width="2" stroke-linejoin="round">
    <rect x="648" y="128" width="176" height="257" rx="12" fill="#191919"/>
    <rect x="660" y="143" width="152" height="47" rx="5" fill="#2a2a2a"/>
    <rect x="660" y="200" width="152" height="47" rx="5" fill="#242424"/>
    <rect x="660" y="257" width="152" height="47" rx="5" fill="#2a2a2a"/>
    <rect x="660" y="314" width="152" height="47" rx="5" fill="#242424"/>
    <path d="M680 160h48m-48 12h48m-48 45h48m-48 12h48m-48 45h48m-48 12h48m-48 45h48m-48 12h48" stroke="#a39d97" stroke-width="3"/>
    <path d="M794 176v36m-10 21v36m10 21v36" fill="none" stroke="#f58220" stroke-width="4"/>
    <path d="M674 385v12m124-12v12" stroke-width="7"/>
  </g>
  <g fill="#f58220">
    <circle cx="772" cy="166" r="4"/>
    <circle cx="772" cy="223" r="4"/>
    <circle cx="772" cy="280" r="4"/>
    <circle cx="772" cy="337" r="4"/>
  </g>
  <text x="736" y="111" text-anchor="middle" font-family="monospace" font-size="17" fill="#b9b7b4">definitely needed.</text>

  <!-- An enthusiastic intern. Access denied, affectionately. -->
  <g stroke="#f58220" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M920 258l-34 25-32-15m120-10 31-37 25 8" fill="none"/>
    <path d="M928 326l-9 40h-22m61-40 10 40h21" fill="none" stroke-width="8"/>
    <rect x="910" y="248" width="70" height="83" rx="17" fill="#303030"/>
    <rect x="896" y="170" width="99" height="78" rx="21" fill="#303030"/>
    <path d="M945 170v-20"/>
    <circle cx="945" cy="144" r="6" fill="#ffa45b" stroke="#ffa45b"/>
    <path d="M921 200v8m48-8v8" stroke="#f2f0ed" stroke-width="7"/>
    <path d="M933 223q12 10 24 0" fill="none"/>
  </g>
  <rect x="918" y="269" width="54" height="29" rx="5" fill="#ffa45b"/>
  <text x="945" y="289" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#111111">AI</text>
  <text x="945" y="397" text-anchor="middle" font-family="monospace" font-size="17" fill="#b9b7b4">intern permissions</text>

  <!-- Production is behind a lock, not a pinky promise. -->
  <g stroke="#ffa45b" stroke-width="2.5" stroke-linejoin="round">
    <rect x="1041" y="174" width="112" height="91" rx="12" fill="#242424"/>
    <circle cx="1097" cy="216" r="23" fill="#d96b22" stroke="#ffa45b"/>
    <rect x="1085" y="208" width="24" height="20" rx="3" fill="#111111" stroke="#f2f0ed"/>
    <path d="M1090 208v-7a7 7 0 0 1 14 0v7" fill="none" stroke="#f2f0ed"/>
  </g>
  <text x="1097" y="253" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffa45b">PRODUCTION</text>
  <g font-family="Verdana, Arial, sans-serif" font-size="17" fill="#f2f0ed">
    <rect x="865" y="47" width="288" height="58" rx="14" fill="#2a2a2a" stroke="#68615b" stroke-width="2"/>
    <path d="M940 105l10 15 10-15" fill="#2a2a2a" stroke="#68615b" stroke-width="2"/>
    <path d="M941 104h18" stroke="#2a2a2a" stroke-width="3"/>
    <text x="1009" y="82" text-anchor="middle">“Can I deploy this?”</text>
  </g>
  <text x="1097" y="293" text-anchor="middle" font-family="monospace" font-size="17" fill="#ffa45b">nice try.</text>
</svg>
