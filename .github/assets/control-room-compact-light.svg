<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="160" role="img" aria-labelledby="title desc"><title id="title">Patrick's control room</title>
  <desc id="desc">A homelab rack, a terminal and a cheerful AI robot reaching for a locked production button. The robot has no production keys.</desc>
  <svg width="100%" height="100%" viewBox="0 0 1200 440" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="accent">
      <stop stop-color="#bc4c00" />
      <stop offset="1" stop-color="#a74600" />
    </linearGradient>
  </defs>
  <g fill="none" stroke-width="2" opacity=".7">
    <path d="M601 44v14m-7-7h14M847 359v14m-7-7h14" stroke="#bc4c00" />
    <path d="M600 210l5-5 5 5-5 5zM1131 334l5-5 5 5-5 5z" stroke="#a74600" />
    <circle cx="837" cy="39" r="4" stroke="#a74600" />
  </g>


  <g font-family="Verdana, Arial, sans-serif">
    <rect x="48" y="42" width="192" height="30" rx="15" fill="none" />
    <circle cx="66" cy="57" r="5" fill="#bc4c00" />
    <text x="80" y="63" font-size="15" font-weight="700" letter-spacing="2" fill="#a74600">HOMELAB ONLINE</text>
    <text x="48" y="132" font-size="44" font-weight="700" letter-spacing="1" fill="#1f2328">PATRICK'S</text>
    <text x="48" y="185" font-size="44" font-weight="700" letter-spacing="1" fill="url(#accent)">CONTROL ROOM</text>
    <text x="50" y="222" font-size="19" fill="#59636e">Infrastructure. Experiments. A suspicious electricity bill.</text>
  </g>


  <g font-family="monospace" font-size="18">
    <rect x="48" y="254" width="520" height="141" rx="12" fill="none" stroke="#59636e" stroke-width="2" />
    <path d="M49 285H567" stroke="#d1d9e0" />
    <circle cx="68" cy="270" r="4" fill="#59636e" />
    <circle cx="84" cy="270" r="4" fill="#a74600" />
    <circle cx="100" cy="270" r="4" fill="#bc4c00" />
    <text x="124" y="276" font-size="14" fill="#59636e">patrick@homelab ~</text>
    <text x="68" y="315" fill="#1f2328"><tspan fill="#bc4c00">$ </tspan>nix run .#another-side-project</text>
    <text x="68" y="346" fill="#59636e">building…</text>
    <text x="68" y="377" fill="#a74600">production excitement: 0 (as intended)</text>
  </g>


  <g stroke="#59636e" stroke-width="2" stroke-linejoin="round">
    <rect x="648" y="128" width="176" height="257" rx="12" fill="none" />
    <rect x="660" y="143" width="152" height="47" rx="5" fill="none" />
    <rect x="660" y="200" width="152" height="47" rx="5" fill="none" />
    <rect x="660" y="257" width="152" height="47" rx="5" fill="none" />
    <rect x="660" y="314" width="152" height="47" rx="5" fill="none" />
    <path d="M680 160h48m-48 12h48m-48 45h48m-48 12h48m-48 45h48m-48 12h48m-48 45h48m-48 12h48" stroke="#59636e" stroke-width="3" />
    <path d="M794 176v36m-10 21v36m10 21v36" fill="none" stroke="#bc4c00" stroke-width="4" />
    <path d="M674 385v12m124-12v12" stroke-width="7" />
  </g>
  <g fill="#bc4c00">
    <circle cx="772" cy="166" r="4" />
    <circle cx="772" cy="223" r="4" />
    <circle cx="772" cy="280" r="4" />
    <circle cx="772" cy="337" r="4" />
  </g>
  <text x="736" y="111" text-anchor="middle" font-family="monospace" font-size="17" fill="#59636e">definitely needed.</text>


  <g stroke="#bc4c00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M920 258l-34 25-32-15m120-10 31-37 25 8" fill="none" />
    <path d="M928 326l-9 40h-22m61-40 10 40h21" fill="none" stroke-width="8" />
    <rect x="910" y="248" width="70" height="83" rx="17" fill="none" />
    <rect x="896" y="170" width="99" height="78" rx="21" fill="none" />
    <path d="M945 170v-20" />
    <circle cx="945" cy="144" r="6" fill="#a74600" stroke="#a74600" />
    <path d="M921 200v8m48-8v8" stroke="#1f2328" stroke-width="7" />
    <path d="M933 223q12 10 24 0" fill="none" />
  </g>
  <rect x="918" y="269" width="54" height="29" rx="5" fill="#a74600" />
  <text x="945" y="289" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#ffffff">AI</text>
  <text x="945" y="397" text-anchor="middle" font-family="monospace" font-size="17" fill="#59636e">intern permissions</text>


  <g stroke="#a74600" stroke-width="2.5" stroke-linejoin="round">
    <rect x="1041" y="174" width="112" height="91" rx="12" fill="none" />
    <circle cx="1097" cy="216" r="23" fill="none" stroke="#a74600" />
    <rect x="1085" y="208" width="24" height="20" rx="3" fill="none" stroke="#1f2328" />
    <path d="M1090 208v-7a7 7 0 0 1 14 0v7" fill="none" stroke="#1f2328" />
  </g>
  <text x="1097" y="253" text-anchor="middle" font-family="monospace" font-size="14" fill="#a74600">PRODUCTION</text>
  <g font-family="Verdana, Arial, sans-serif" font-size="17" fill="#1f2328">
    <rect x="865" y="47" width="288" height="58" rx="14" fill="none" stroke="#59636e" stroke-width="2" />
    <path d="M940 105l10 15 10-15" fill="none" stroke="#59636e" stroke-width="2" />
    <path d="M941 104h18" stroke="none" stroke-width="3" />
    <text x="1009" y="82" text-anchor="middle">“Can I deploy this?”</text>
  </g>
  <text x="1097" y="293" text-anchor="middle" font-family="monospace" font-size="17" fill="#a74600">nice try.</text>
</svg></svg>
