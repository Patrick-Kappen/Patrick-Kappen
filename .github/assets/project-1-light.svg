<title id="title">Patrick-Kappen/PiG</title>
<desc id="desc">PiG (Pi in Go) is a faithful Go port of upstream Pi, the TypeScript codebase behind the Pi coding agent. It is a parity-bound translation, not a rewrite: upstream behavior is the contract, and Go is the implementation language. Latest activity: Take fork main with SDK arguments and tool_call fixes (#33, #37, #38). OPEN PR on 2026-11-13.</desc>
