---
name: Update profile README

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - .github/scripts/update_readme.py
  workflow_run:
    workflows: [Build website]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get a token for this repository
        id: readme-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WEBSITE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          repositories: Patrick-Kappen
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.readme-token.outputs.token }}

      - name: Get a token for the content
        id: content-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WEBSITE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          repositories: website_content
          permission-contents: read

      - name: Checkout content
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Patrick-Kappen/website_content
          ref: main
          path: content
          token: ${{ steps.content-token.outputs.token }}
          persist-credentials: false

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml==6.0.3

      - name: Render generated sections
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_readme.py

      - name: Commit when changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh generated README section" README.md
          git push
